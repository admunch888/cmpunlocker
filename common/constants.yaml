gpu:
  vendor_id: "10de"
  device_ids:
    "8gb": "0x20C2"
    "10gb": "0x2082"

profiles:
  "8gb":
    stock_mib: 8192
    unlocked_mib: 65536
    cfg1: "0x02779000"
    lmr: "0x0000020B"
    fb_bytes: "0x0000001000000000"
    label: "64GB"
    geometry_rewrite: true
  "10gb":
    stock_mib: 10240
    unlocked_mib: 40960
    cfg1: "0x02669000"
    lmr: "0x0000028A"
    fb_bytes: "0x0000000A00000000"
    label: "40GB"
    geometry_rewrite: true
  "mixed":
    stock_mib: 8192
    unlocked_mib: 65536
    cfg1: "0x02779000"
    lmr: "0x0000020B"
    fb_bytes: "0x0000001000000000"
    label: "mixed"
    geometry_rewrite: false

passthrough:
  module: cmp_no_bus_reset
  gsp_boot_state:
    wpr2_addr_lo:          { addr: "0x001FA824", value: "0x1FFFFE00" }
    wpr2_addr_hi:          { addr: "0x001FA828", value: "0x00000000" }
    bsi_secure_scratch_14: { addr: "0x001180F8", value: "0x00000000" }

unlocks:
  privilege_masks:
    patch: sec2-postbl-plm-ss-cfg.patch
    registers:
      pjtag_plm:      { addr: "0x0000c840", value: "0xffffffff" }
      pjtag_sec_plm:  { addr: "0x0000c848", value: "0xffffffff" }
      xve:            { addr: "0x00088ff4", value: "0xffffffff" }
      xve_b:          { addr: "0x00088ab4", value: "0xffffffff" }
      xve_c:          { addr: "0x00088ff8", value: "0xffffffff" }
      wpr:            { addr: "0x001fa7c4", value: "0xffffffff" }
      wpr_cfg:        { addr: "0x001fa7cc", value: "0xfffff0ff" }
      opt_plm:        { addr: "0x008200fc", value: "0xffffffff" }
      feat:           { addr: "0x00823804", value: "0xffffffff" }
      feat2:          { addr: "0x00823b00", value: "0xffffffff" }
      fbpa_plm:       { addr: "0x009a0148", value: "0xffffffff" }

  compute_throughput:
    patch: sec2-postbl-plm-ss-cfg.patch
    registers:
      sm_speed_select_0: { addr: "0x0082381c", value: "0x88888888" }
      sm_speed_select_1: { addr: "0x00823820", value: "0x00000008" }

  memory_geometry:
    patch: sec2-postbl-plm-ss-cfg.patch
    registers:
      fbpa_cfg1: { addr: "0x009a0204" }
      ltc_lmr:   { addr: "0x00100ce0" }
      wpr2_lo:   { addr: "0x001fa824" }
      wpr2_hi:   { addr: "0x001fa828" }

  pcie_gen2:
    patch: pcie-gen2.patch
    registers:
      link_cap:            { addr: "0x00088084" }
      link_cap2:           { addr: "0x000880a4" }
      link_control_2:      { addr: "0x000880a8" }
      link_control_status: { addr: "0x00088088" }
      pl_link_rate:        { addr: "0x0008c1c0", value: "0x00240036" }
      fuse_override:       { addr: "0x0008872c" }
      priv_misc_1:         { addr: "0x0008841c" }
      vsec_device:         { addr: "0x0008860c" }
      vsec_hierarchy:      { addr: "0x00088610" }
      xp3g_status_base:    { addr: "0x0008e100" }
      xp3g_override_base:  { addr: "0x0008e110" }
      xp3g_value_base:     { addr: "0x0008e120" }
      opt_gen23:           { addr: "0x0082057c" }
      opt_gen3:            { addr: "0x00820580" }
      opt_magic:           { addr: "0x00820520" }

  pcie_retrain:
    patch: pcie-gen2-probe-retrain.patch
    registers:
      link_config_0: { addr: "0x8c040" }
      fuse_override: { addr: "0x8872c" }
      pl_cya_0:      { addr: "0x8c2c0" }

  bar1_resize:
    patch: bar1-resize-unlock.patch
    registers: {}

  gpu_name:
    patch: name-string.patch
    registers: {}

  persistence:
    patch: persistent-sw-state.patch
    registers: {}

  late_pma:
    patch: late-pma.patch
    registers: {}

  bar0_pramin_clamp:
    patch: bar0-pramin-clamp.patch
    registers: {}

  ce_scrub:
    patch: ce-scrub-workarounds.patch
    registers: {}

  booter_verify:
    patch: booter-verify.patch
    registers: {}

  cmp-sku-mask:
    patch: cmp-sku-mask.patch
    registers: {}

  #
  # Opt-in groups. build.sh appends these to PATCH_ORDER only for --mclk-ndiv
  # and --p2p builds, so they carry an explicit group here.
  #

  hbm_clock_pre_gsp:
    patch: mclk-clock-tuning-pre-gsp.patch
    group: mclk
    registers:
      hbmpll_plm:        { addr: "0x00903C7C" }
      hbmpll_coeff:      { addr: "0x00903C98" }
      fbio_broadcast:    { addr: "0x009A0590" }
      hbm_self_refresh:  { addr: "0x009A031C" }
      ddll_cal_ctrl:     { addr: "0x009A11DC" }
      ddll_cal_status_0: { addr: "0x009A0674" }
      ddll_cal_status_1: { addr: "0x009A0678" }
      fbpa_base:         { addr: "0x00900000" }
      fbpa_stride:       { addr: "0x00004000" }
      fbpa_cfg_offset:   { addr: "0x00003C90" }
      fbpa_coeff_offset: { addr: "0x00003C98" }
    requires:
      # build.sh rewrites this exact line from --mclk-ndiv; the tree is left
      # deliberately uncompilable until it does.
      - "static const NvU32 newNdiv = XX;"

  hbm_clock_post_gsp:
    patch: mclk-clock-tuning-post-gsp.patch
    group: mclk
    registers:
      hbmpll_plm:           { addr: "0x00903C7C" }
      hbmpll_cfg:           { addr: "0x00903C90" }
      hbmpll_coeff:         { addr: "0x00903C98" }
      fbpa_coeff_multicast: { addr: "0x0098BC98" }
      pri_fence:            { addr: "0x001211FC" }
    requires:
      - "static const NvU32 newNdiv = XX;"
      - "_kgspSec2PostblTimingEnabled"

  p2p_caps_override:
    patch: p2p-caps-override.patch
    group: p2p
    registers: {}
    requires:
      - "pcieP2PReadCaps"
      - "pcieP2PWriteCaps"

  p2p_bar1:
    patch: p2p-bar1.patch
    group: p2p
    registers: {}
    requires:
      - "NV_REG_STR_RM_PCIEP2P_TYPE_BAR1"
      - "kbusIsPcieBar1P2PMappingSupported"

  p2p_mailbox_skip:
    patch: p2p-skip-mailbox-preinit.patch
    group: p2p
    registers: {}
    requires:
      # Gated on the registry-selected P2P type, not on a device id.
      - "NV_REG_STR_RM_PCIEP2P_TYPE_BAR1"
      - "kbusIsP2pMailboxClientAllocated"

  p2p_readcap_override:
    patch: p2p-readcap-override.patch
    group: p2p
    registers: {}
    requires:
      - "NV0000_P2P_CAPS_STATUS_OK"
      - "bCommonPciSwitchFound"
